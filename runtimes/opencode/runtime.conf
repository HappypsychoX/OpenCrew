# OpenCrew runtime manifest: OpenCode
# Parsed by scripts/install.ps1 and scripts/install.sh (simple key=value, no nesting).

display=OpenCode
target=~/.config/opencode/agents
detect_command=opencode
detect_dir=~/.config/opencode

model.crew-lead=opencode-go/deepseek-v4-pro
model.architect=opencode-go/glm-5.3-flash
model.implementer=opencode-go/kimi-k2.7-code
model.reviewer=opencode-go/deepseek-v4-flash
model.repo-scout=opencode-go/deepseek-v4-flash
model.grunt=opencode-go/mimo-v2.5

# Sampling temperature per agent (default 0.1 when unset).
# architect runs warmer: design exploration benefits from more variation.
temperature.architect=0.2

# Short inline phrase naming the delegation mechanism, used in the crew list.
delegation_inline=via the task mechanism
