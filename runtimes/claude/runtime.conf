# OpenCrew runtime manifest: Claude Code
# Parsed by scripts/install.ps1 and scripts/install.sh (simple key=value, no nesting).

display=Claude Code
target=~/.claude/agents
detect_command=claude
detect_dir=~/.claude

# Model assignment per agent. Claude Code accepts generation aliases
# (opus/sonnet/haiku), which track the current generation across upgrades,
# or pinned IDs (claude-opus-5, claude-sonnet-5, claude-haiku-4-5).
# Aliases are used here so OpenCrew keeps working when a generation ships.
model.crew-lead=opus
model.architect=opus
model.implementer=sonnet
model.reviewer=sonnet
model.repo-scout=haiku
model.grunt=haiku

# Short inline phrase naming the delegation mechanism, used in the crew list.
delegation_inline=with the `Task` tool
